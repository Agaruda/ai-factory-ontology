[project]
name = "ai-factory-ontology"
version = "0.1.0"
description = "AI Factory Ontology: an extension of Brick and ASHRAE 223 for AI data centers"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.1",
    "pyshacl>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: checks against ASHRAE 223's own shapes, which take minutes"]
addopts = "-m 'not slow'"
